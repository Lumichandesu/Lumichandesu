<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title"><title id="title">Measure, understand, design, implement, test, observe, optimize, harden, then repeat.</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#181825"/><stop offset="1" stop-color="#302544"/></linearGradient><linearGradient id="accent"><stop stop-color="#f5bde6"/><stop offset=".5" stop-color="#c6a0f6"/><stop offset="1" stop-color="#91d7e3"/></linearGradient><radialGradient id="glow"><stop stop-color="#c6a0f6" stop-opacity=".2"/><stop offset="1" stop-color="#c6a0f6" stop-opacity="0"/></radialGradient><clipPath id="canvas"><rect width="720" height="440" rx="22"/></clipPath></defs><g clip-path="url(#canvas)"><rect width="720" height="440" rx="24" fill="url(#bg)"/><text x="30" y="43" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#b8acd3" font-weight="600" text-anchor="start">HOW I APPROACH ENGINEERING</text><text x="30" y="82" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" fill="#f0e8ff" font-weight="600" text-anchor="start">Learn, build, and keep improving.</text><rect x="30" y="114" width="156" height="108" rx="14" fill="#91d7e3" fill-opacity=".08" stroke="#91d7e3" stroke-opacity=".35"/><text x="48" y="148" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#91d7e3" font-weight="600" text-anchor="start">01</text><text x="108" y="192" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#f0e8ff" font-weight="500" text-anchor="middle">Measure</text><rect x="198" y="114" width="156" height="108" rx="14" fill="#c6a0f6" fill-opacity=".08" stroke="#c6a0f6" stroke-opacity=".35"/><text x="216" y="148" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#c6a0f6" font-weight="600" text-anchor="start">02</text><text x="276" y="192" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#f0e8ff" font-weight="500" text-anchor="middle">Understand<