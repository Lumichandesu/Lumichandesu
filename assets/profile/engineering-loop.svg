<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="278" viewBox="0 0 1200 278" role="img" aria-labelledby="title"><title id="title">Measure, understand, design, implement, test, observe, optimize, harden, then repeat.</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#181825"/><stop offset="1" stop-color="#302544"/></linearGradient><linearGradient id="accent"><stop stop-color="#f5bde6"/><stop offset=".5" stop-color="#c6a0f6"/><stop offset="1" stop-color="#91d7e3"/></linearGradient><radialGradient id="glow"><stop stop-color="#c6a0f6" stop-opacity=".2"/><stop offset="1" stop-color="#c6a0f6" stop-opacity="0"/></radialGradient><clipPath id="canvas"><rect width="1200" height="278" rx="22"/></clipPath></defs><g clip-path="url(#canvas)"><rect width="1200" height="278" rx="22" fill="url(#bg)"/><text x="40" y="45" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#b8acd3" font-weight="600" text-anchor="start">HOW I APPROACH ENGINEERING</text><text x="40" y="82" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" fill="#f0e8ff" font-weight="600" text-anchor="start">Learn, build, and keep improving.</text><rect x="40" y="112" width="128" height="90" rx="14" fill="#91d7e3" fill-opacity=".08" stroke="#91d7e3" stroke-opacity=".35"/><text x="56" y="143" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#91d7e3" font-weight="600" text-anchor="start">01</text><text x="104" y="178" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#f0e8ff" font-weight="500" text-anchor="middle">Measure</text><path d="M170 158H180M176 154L180 158L176 162" stroke="#8e82a3" fill="none"/><rect x="181" y="112" width="128" height="90" rx="14" fill="#c6a0f6" fill-opacity=".08" stroke="#c6a0f6" stroke-opacity=".35"/><text x="197" y="143" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#c6a0f6" font-weight="600" text-anchor="start">02</text><text x="245" y="178" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#f0e8ff" font-weight="500" text-anchor="middle">Understand</text><path d="M311 158H321M317 154L321 158L317 162" stroke="#8e82a3" fill="none"/><rect x="322" y="112" width="128" height="90" rx="14" fill="#f5bde6" fill-opacity=".08" stroke="#f5bde6" stroke-opacity=".35"/><text x="338" y="143" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#f5bde6" font-weight="600" text-anchor="start">03</text><text x="386" y="178" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#f0e8ff" font-weight="500" text-anchor="middle">Design</text><path d="M452 158H462M458 154L462 158L458 162" stroke="#8e82a3" fill="none"/><rect x="463" y="112" width="128" height="90" rx="14" fill="#a6da95" fill-opacity=".08" stroke="#a6da95" stroke-opacity=".35"/><text x="479" y="143" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#a6da95" font-weight="600" text-anchor="start">04</text><text x="527" y="178" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#f0e8ff" font-weight="500" text-anchor="middle">Implement</text><path d="M593 158H603M599 154L603 158L599 162" stroke="#8e82a3" fill="none"/><rect x="604" y="112" width="128" height="90" rx="14" fill="#91d7e3" fill-opacity=".08" stroke="#91d7e3" stroke-opacity=".35"/><text x="620" y="143" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#91d7e3" font-weight="600" text-anchor="start">05</text><text x="668" y="178" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#f0e8ff" font-weight="500" text-anchor="middle">Test</text><path d="M734 158H744M740 154L744 158L740 162" stroke="#8e82a3" fill="none"/><rect x="745" y="112" width="128" height="90" rx="14" fill="#c6a0f6" fill-opacity=".08" stroke="#c6a0f6" stroke-opacity=".35"/><text x="761" y="143" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#c6a0f6" font-weight="600" text-anchor="start">06</text><text x="809" y="178" font-family="DejaVu Sans, Arial, sans-serif" font-siz